elasticsearch:
  hosts:
    - "http://localhost:9200"
  read_only_user: "meerkat_reader"

llm:
  provider: "gemini"
  model_relation_assess: "gemini-3.6-flash"  # 무료 티어는 pro 등급 할당량이 0이라 flash만 쓸 수 있음
  model_rule_generate: "gemini-3.6-flash"
  model_rule_repair: "gemini-3.6-flash"
  model_sample_select: "gemini-3.6-flash"
  temperature: 0.0

retry:
  max_repair_attempts: 3

suricata:
  binary: "suricata"
  container_image: null
  rule_sid_range: [1000000, 1999999]

paths:
  pcaps_attack: "pcaps/attack"
  pcaps_benign: "pcaps/benign"
  rules_dir: "rules"
  pcap_log_dir: null  # Suricata pcap-log 회전 파일 디렉토리

deploy:
  mode: "file"  # none | file | pr — pr은 repo_dir가 별도 GitOps 룰 레포 체크아웃일 때만 쓴다
  repo_dir: "."
  proposals_dir: ".meerkat/deploy_proposals"
  audit_log_path: ".meerkat/audit/decisions.jsonl"  # 판단 과정 JSONL (사람 열람·평가 집계용)
