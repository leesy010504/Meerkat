groups:
  scanning:
    protocols: [tcp, udp, icmp]
    direction: inbound
    # threshold/detection_filter는 rate-based 룰에만 특징적으로 나타난다
    expected_keywords: [threshold, detection_filter]
    classtypes: [attempted-recon, network-scan]

  web-attack:
    protocols: [http]
    direction: inbound
    target_services: [ingress-nginx]
    classtypes: [web-application-attack, attempted-admin]

  dns-flood:
    protocols: [udp]
    direction: inbound
    # "53"/"dns"로 DNS 트래픽임을 확인한다 — threshold/detection_filter만 보면
    # NTP/SSDP/memcached 같은 DNS와 무관한 UDP 증폭 공격도 protocol(udp)과
    # classtype(denial-of-service)만으로 여기 잘못 흡수된다.
    expected_keywords: ["53", "dns"]
    classtypes: [denial-of-service]

  auth-bruteforce:
    protocols: [tcp]
    direction: inbound
    # 인증 브루트포스는 단일 출발지가 같은 서비스 포트로 짧은 시간에 반복 접속하는 rate 패턴이다.
    # 포트스캔(scanning)과는 classtype으로 구분한다 — attempted-recon이 아니라 계정 탈취 시도.
    expected_keywords: [threshold, detection_filter]
    classtypes: [attempted-admin, attempted-user, unsuccessful-user]
