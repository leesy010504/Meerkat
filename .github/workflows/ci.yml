name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Suricata 8 (검증 엔진)
        run: |
          sudo add-apt-repository -y ppa:oisf/suricata-8.0
          sudo apt-get update
          sudo apt-get install -y suricata tcpdump
          suricata -V

      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src tests eval scripts

      # ES(localhost:9200), HF_TOKEN(Prompt Guard), GEMINI_API_KEY가 없는 테스트는 자동 skip된다.
      # 분류 모델이 필요한 인젝션 필터 테스트는 HF_TOKEN 시크릿을 넣으면 함께 돈다.
      - name: Test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest tests/ -q
