# 이 파일은 scripts/render_rules_configmap.py가 rules/*.rules에서 생성한다. 직접 편집하지 말 것.
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-rules
  namespace: meerkat
data:
  local.rules: |
    # --- auth-bruteforce.rules ---
    alert tcp $EXTERNAL_NET any -> $HOME_NET [22,2222] (msg:"LOCAL SSH Brute Force - Many Connections from Single Source"; flow:to_server; flags:S,12; threshold:type threshold, track by_src, count 10, seconds 60; classtype:attempted-admin; sid:1000003; rev:1;)
    # --- dns-flood.rules ---
    alert udp $EXTERNAL_NET any -> $HOME_NET 53 (msg:"LOCAL DNS Query Flood from Single Source"; dns.opcode:0; threshold:type threshold, track by_src, count 100, seconds 60; classtype:denial-of-service; sid:1000004; rev:1;)
    # --- scanning.rules ---
    alert tcp $EXTERNAL_NET any -> $HOME_NET any (msg:"LOCAL Port Scan - Multiple Ports from Single Source"; flow:to_server; flags:S,12; threshold:type threshold, track by_src, count 200, seconds 60; classtype:attempted-recon; sid:1000001; rev:2;)
    alert tcp $HOME_NET any -> $EXTERNAL_NET any (msg:"LOCAL Slow Port Scan - Many Refused Connections to Single Source"; flow:to_client; flags:RA,12; threshold:type both, track by_dst, count 50, seconds 300; classtype:attempted-recon; sid:1000006; rev:1;)
    # --- web-attack.rules ---
    alert http $EXTERNAL_NET any -> $HOME_NET any (msg:"LOCAL Gobuster Directory Scan Detected"; flow:to_server; http.user_agent; content:"gobuster"; nocase; classtype:web-application-attack; sid:1000002; rev:2;)
    alert http $HOME_NET any -> $EXTERNAL_NET any (msg:"LOCAL HTTP 404 Burst - Directory Enumeration (UA-agnostic)"; flow:to_client,established; http.stat_code; content:"404"; threshold:type both, track by_dst, count 50, seconds 60; classtype:web-application-attack; sid:1000005; rev:1;)
