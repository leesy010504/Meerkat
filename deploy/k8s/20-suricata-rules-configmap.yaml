# rules/scanning.rules, rules/web-attack.rules 그대로
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-rules
  namespace: meerkat
data:
  local.rules: |
    alert tcp any any -> any any (msg:"LOCAL Port Scan - Multiple Ports from Single Source"; flow:to_server; threshold:type threshold, track by_src, count 70, seconds 60; classtype:attempted-recon; sid:1000001; rev:1;)
    alert tcp any any -> any any (msg:"LOCAL Gobuster Directory Scan Detected"; http.user_agent; content:"gobuster"; classtype:web-application-attack; sid:1000002; rev:1;)
