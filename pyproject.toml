[project]
name = "meerkat"
version = "0.1.0"
description = "Agentic Suricata rule generation and maintenance"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "elasticsearch[async]>=8.0,<9.0",
    "mcp>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "transformers>=4.45",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meerkat"]